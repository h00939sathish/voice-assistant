<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jarvis — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    :root {
      --bg:          #070713;
      --surface:     #0b0b1e;
      --surface-2:   #10102a;
      --surface-3:   #161638;
      --border:      #1c1c42;
      --border-hi:   #2a2a5c;
      --gold:        #D4A84B;
      --gold-dim:    rgba(212, 168, 75, 0.12);
      --gold-glow:   rgba(212, 168, 75, 0.2);
      --teal:        #2DD4BF;
      --teal-dim:    rgba(45, 212, 191, 0.12);
      --red:         #e85454;
      --red-dim:     rgba(232, 84, 84, 0.12);
      --green:       #3ecf8e;
      --green-dim:   rgba(62, 207, 142, 0.12);
      --amber:       #e8a84b;
      --amber-dim:   rgba(232, 168, 75, 0.12);
      --text:        #eae6e0;
      --text-dim:    #8884a0;
      --muted:       #56527a;
      --font:        'Inter', system-ui, sans-serif;
      --font-display:'Syne', sans-serif;
      --font-mono:   'JetBrains Mono', monospace;
      --radius:      12px;
      --radius-sm:   8px;
      --header-h:    56px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      height: 100dvh;
      display: grid;
      grid-template-rows: var(--header-h) 1fr;
      grid-template-columns: 1fr 380px;
      grid-template-areas:
        "header header"
        "chat   sidebar";
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 50% at 0% 100%, rgba(212, 168, 75, 0.03), transparent),
        radial-gradient(ellipse 50% 40% at 100% 0%, rgba(45, 212, 191, 0.025), transparent);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Scrollbar ──────────────────────────── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-hi); border-radius: 4px; }

    /* ── Header ─────────────────────────────── */
    header {
      grid-area: header;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: relative;
      z-index: 10;
    }
    header::after {
      content: '';
      position: absolute;
      bottom: 0; left: 80px; right: 80px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      opacity: 0.3;
    }

    .logo {
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text);
    }
    .logo span { color: var(--gold); }

    #header-orb {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, var(--muted), transparent);
      border: 1.5px solid var(--muted);
      transition: all 0.4s;
      flex-shrink: 0;
      position: relative;
    }
    #header-orb::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      opacity: 0;
      transition: opacity 0.4s;
    }
    #header-orb.listening  { background: radial-gradient(circle at 35% 35%, var(--green), #070713); border-color: var(--green); box-shadow: 0 0 16px var(--green-dim); }
    #header-orb.processing { background: radial-gradient(circle at 35% 35%, var(--amber), #070713); border-color: var(--amber); box-shadow: 0 0 16px var(--amber-dim); }
    #header-orb.speaking   { background: radial-gradient(circle at 35% 35%, var(--teal), #070713);  border-color: var(--teal);  box-shadow: 0 0 16px var(--teal-dim); }
    #header-orb.error       { background: radial-gradient(circle at 35% 35%, var(--red), #070713);   border-color: var(--red);   box-shadow: 0 0 16px var(--red-dim); }
    #header-orb.wake        { background: radial-gradient(circle at 35% 35%, var(--gold), #070713); border-color: var(--gold);  box-shadow: 0 0 16px var(--gold-glow); }
    #header-orb.idle        { background: radial-gradient(circle at 35% 35%, var(--muted), transparent); border-color: var(--muted); box-shadow: none; }

    #status-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1.2px;
      min-width: 70px;
    }

    .spacer { flex: 1; }

    .btn {
      font-family: var(--font);
      font-size: 11px;
      font-weight: 500;
      padding: 5px 14px;
      border-radius: 20px;
      border: 1px solid var(--border-hi);
      background: var(--surface-2);
      color: var(--text-dim);
      cursor: pointer;
      transition: all 0.2s;
      outline: none;
      white-space: nowrap;
    }
    .btn:hover { border-color: var(--gold); color: var(--gold); background: var(--gold-dim); }
    .btn:active { transform: scale(0.96); }
    .btn.loading { opacity: 0.5; pointer-events: none; }

    .conn-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--muted);
      letter-spacing: 0.5px;
    }
    .conn-badge.live {
      background: var(--green-dim);
      border-color: var(--green);
      color: var(--green);
    }

    .cmd-hint {
      font-size: 10px;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 6px;
      font-family: var(--font-mono);
      letter-spacing: 0.3px;
    }

    /* ── Waveform ───────────────────────────── */
    #waveform {
      display: flex;
      align-items: center;
      gap: 2px;
      height: 24px;
      margin-right: 8px;
    }
    #waveform .bar {
      width: 2px;
      background: var(--gold);
      border-radius: 1px;
      opacity: 0.15;
      transition: height 0.15s, opacity 0.3s;
      height: 4px;
    }
    #waveform .bar.active { opacity: 0.6; }
    #waveform .bar.speaking { opacity: 0.8; background: var(--teal); }
    #waveform .bar.idle { opacity: 0.05; }

    /* ── Chat pane ──────────────────────────── */
    #chat-pane {
      grid-area: chat;
      min-width: 0;
      display: grid;
      grid-template-rows: 1fr auto;
      overflow: hidden;
      position: relative;
      z-index: 1;
    }

    #chat {
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      scroll-behavior: smooth;
    }

    .msg {
      max-width: 76%;
      padding: 11px 16px;
      border-radius: var(--radius);
      font-size: 13.5px;
      line-height: 1.6;
      animation: msgIn 0.25s ease;
      position: relative;
    }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: none; }
    }

    .msg.user {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--gold-dim), transparent);
      border: 1px solid rgba(212, 168, 75, 0.2);
    }
    .msg.assistant {
      align-self: flex-start;
      background: var(--surface);
      border: 1px solid var(--border);
    }
    .msg .role {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 5px;
      color: var(--muted);
    }
    .msg.user .role { color: var(--gold); }
    .msg .timestamp {
      font-size: 10px;
      color: var(--muted);
      margin-left: 8px;
    }
    .msg .copy-btn {
      position: absolute;
      top: 6px; right: 6px;
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      opacity: 0;
      transition: opacity 0.2s;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .msg:hover .copy-btn { opacity: 1; }
    .msg .copy-btn:hover { background: var(--surface-3); color: var(--text); }

    .msg strong { color: #fff; font-weight: 600; }
    .msg a { color: var(--gold); text-decoration: underline; }
    .msg code {
      background: rgba(212, 168, 75, 0.08);
      border: 1px solid rgba(212, 168, 75, 0.15);
      border-radius: 4px;
      padding: 1px 5px;
      font-family: var(--font-mono);
      font-size: 12px;
    }
    .msg pre {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px;
      overflow-x: auto;
      margin-top: 6px;
    }
    .msg pre code {
      background: none;
      border: none;
      padding: 0;
      font-size: 12px;
      color: var(--text);
    }
    .hljs { background: transparent !important; }
    .hljs-keyword  { color: #c792ea; }
    .hljs-string   { color: #c3e88d; }
    .hljs-number   { color: #f78c6c; }
    .hljs-comment  { color: #56527a; font-style: italic; }
    .hljs-function { color: #82aaff; }
    .hljs-variable { color: #f07178; }

    .empty-state {
      margin: auto;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }
    .empty-state .ring {
      width: 56px; height: 56px;
      border-radius: 50%;
      border: 1.5px solid rgba(212, 168, 75, 0.3);
      margin: 0 auto 18px;
      position: relative;
      animation: ringPulse 3s ease-in-out infinite;
    }
    .empty-state .ring::before {
      content: '';
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--gold-dim), transparent);
    }
    @keyframes ringPulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(212, 168, 75, 0.2), 0 0 20px rgba(212, 168, 75, 0.05); border-color: rgba(212, 168, 75, 0.3); }
      50%      { box-shadow: 0 0 0 12px rgba(212, 168, 75, 0), 0 0 28px rgba(212, 168, 75, 0.12); border-color: rgba(212, 168, 75, 0.5); }
    }

    #chat-composer {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 10px;
      padding: 14px 20px 18px;
      border-top: 1px solid var(--border);
      background: linear-gradient(180deg, transparent, rgba(11,11,30,0.95));
      position: relative;
    }
    #chat-composer::before {
      content: '';
      position: absolute;
      top: 0; left: 40px; right: 40px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(212, 168, 75, 0.15), transparent);
    }
    #chat-input {
      width: 100%;
      min-height: 44px;
      max-height: 120px;
      resize: vertical;
      background: rgba(7,7,19,0.85);
      border: 1px solid var(--border-hi);
      border-radius: var(--radius);
      padding: 12px 14px;
      color: var(--text);
      font: inherit;
      line-height: 1.45;
      outline: none;
    }
    #chat-input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 2px var(--gold-dim);
    }
    #chat-input::placeholder { color: var(--muted); }

    .composer-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-dim);
      user-select: none;
      white-space: nowrap;
      padding: 0 4px;
    }
    .composer-toggle input { accent-color: var(--gold); }
    #chat-send {
      min-width: 96px;
      padding: 0 16px;
      border-radius: var(--radius);
      border: 1px solid var(--gold);
      background: linear-gradient(135deg, var(--gold) 0%, #c49530 100%);
      color: #070713;
      font: inherit;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
    }
    #chat-send:hover {
      box-shadow: 0 4px 20px rgba(212, 168, 75, 0.3);
      transform: translateY(-1px);
    }
    #chat-send:disabled {
      opacity: 0.5;
      cursor: wait;
      transform: none;
      box-shadow: none;
    }

    /* ── Sidebar ────────────────────────────── */
    #sidebar {
      grid-area: sidebar;
      background: var(--surface);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 1;
    }

    .panel {
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }
    .panel.collapsed .panel-body { display: none; }

    .panel-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s;
    }
    .panel-header:hover { background: var(--surface-2); }

    .panel-title {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--text-dim);
      flex: 1;
    }
    .panel-title .icon { margin-right: 5px; }
    .panel-badge {
      font-size: 9px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 8px;
      background: var(--surface-3);
      color: var(--muted);
      min-width: 16px;
      text-align: center;
    }
    .panel-collapse-icon {
      font-size: 9px;
      color: var(--muted);
      transition: transform 0.2s;
    }
    .panel.collapsed .panel-collapse-icon { transform: rotate(-90deg); }

    .panel-body {
      padding: 6px 12px 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      overflow-y: auto;
      max-height: 200px;
    }
    .panel-body:empty::after {
      content: 'No data';
      display: block;
      color: var(--muted);
      font-size: 11px;
      text-align: center;
      padding: 8px 0;
    }

    .subsystem-row, .task-row, .action-row,
    .failure-row, .audit-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 7px 10px;
      font-size: 12px;
      transition: border-color 0.2s;
      min-height: 32px;
    }
    .subsystem-row:hover, .task-row:hover,
    .action-row:hover, .failure-row:hover { border-color: var(--border-hi); }

    .subsystem-row .label, .task-row .label, .action-row .label {
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    .pill {
      border-radius: 999px;
      padding: 1px 7px;
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
      border: 1px solid var(--border-hi);
      color: var(--muted);
      flex-shrink: 0;
    }
    .pill.healthy, .pill.ok, .pill.completed, .pill.approved { color: var(--green); border-color: var(--green); background: var(--green-dim); }
    .pill.degraded, .pill.running, .pill.pending, .pill.denied { color: var(--amber); border-color: var(--amber); background: var(--amber-dim); }
    .pill.down, .pill.error, .pill.failed, .pill.blocked, .pill.high { color: var(--red); border-color: var(--red); background: var(--red-dim); }

    /* Metrics */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 5px;
    }
    .metric-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 7px 9px;
    }
    .metric-value {
      font-size: 15px;
      font-weight: 700;
      font-family: var(--font-display);
      color: var(--text);
    }
    .metric-label {
      font-size: 9px;
      color: var(--muted);
      margin-top: 1px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    #latency-sparkline {
      display: block;
      width: 100%;
      height: 28px;
      margin-top: 4px;
    }

    .auth-summary {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      padding: 4px 0 2px;
    }
    .auth-chip {
      font-size: 9px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 8px;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .auth-chip.approved { color: var(--green); border-color: var(--green); }
    .auth-chip.denied   { color: var(--amber); border-color: var(--amber); }
    .auth-chip.blocked  { color: var(--red);   border-color: var(--red); }

    #uptime-display {
      font-size: 10px;
      color: var(--muted);
      padding: 3px 0 0;
      grid-column: span 2;
    }

    /* Reminders */
    #reminders-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
      overflow-y: auto;
      flex: 1;
    }
    .reminder-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      animation: msgIn 0.2s ease;
    }
    .reminder-card .r-icon { font-size: 14px; margin-top: 1px; flex-shrink: 0; }
    .reminder-card .r-body { flex: 1; min-width: 0; }
    .reminder-card .r-msg {
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .reminder-card .r-time {
      font-size: 10px;
      color: var(--muted);
      margin-top: 2px;
    }
    .reminder-card .r-cancel {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
      padding: 2px;
      flex-shrink: 0;
      transition: color 0.2s;
    }
    .reminder-card .r-cancel:hover { color: var(--red); }
    .no-reminders {
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      padding: 16px 0;
    }

    /* ── Toast ──────────────────────────────── */
    #toast-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 10000;
      pointer-events: none;
    }
    .toast {
      background: var(--surface-2);
      border: 1px solid var(--border-hi);
      border-radius: var(--radius-sm);
      padding: 9px 12px;
      font-size: 12px;
      color: var(--text);
      min-width: 220px;
      max-width: 300px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.5);
      animation: toastIn 0.25s ease;
      pointer-events: auto;
    }
    .toast.leaving { animation: toastOut 0.25s ease forwards; }
    .toast-icon { font-size: 14px; flex-shrink: 0; }
    .toast.success { border-color: var(--green); }
    .toast.error   { border-color: var(--red); }
    .toast.info    { border-color: var(--gold); }
    @keyframes toastIn {
      from { opacity: 0; transform: translateX(30px); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes toastOut {
      from { opacity: 1; transform: none; }
      to   { opacity: 0; transform: translateX(30px); }
    }

    /* ── Filter bar ─────────────────────────── */
    #filter-bar {
      display: none;
      padding: 6px 12px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
      gap: 8px;
      align-items: center;
    }
    #filter-bar.visible { display: flex; }
    #action-filter {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 5px 10px;
      font-family: var(--font);
      font-size: 11px;
      color: var(--text);
      outline: none;
    }
    #action-filter:focus { border-color: var(--gold); }

    /* ── Command palette ────────────────────── */
    #cmd-palette {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(7,7,19,0.7);
      backdrop-filter: blur(8px);
      z-index: 9999;
      align-items: flex-start;
      justify-content: center;
      padding-top: 15vh;
    }
    #cmd-palette.visible { display: flex; }
    .cmd-box {
      background: var(--surface);
      border: 1px solid var(--border-hi);
      border-radius: 16px;
      width: 480px;
      max-width: 90vw;
      max-height: 50vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      animation: cmdIn 0.15s ease;
    }
    @keyframes cmdIn { from { opacity:0; transform: scale(0.96) translateY(-10px); } to { opacity:1; transform: none; } }
    .cmd-input-wrap {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }
    #cmd-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--gold);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      outline: none;
    }
    #cmd-input::placeholder { color: var(--muted); }
    .cmd-results {
      overflow-y: auto;
      padding: 6px;
    }
    .cmd-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background 0.1s;
    }
    .cmd-item:hover, .cmd-item.selected { background: var(--surface-2); }
    .cmd-item .cmd-key {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--muted);
      min-width: 24px;
    }
    .cmd-item .cmd-label { flex: 1; font-size: 13px; }
    .cmd-item .cmd-desc { font-size: 11px; color: var(--text-dim); }

    /* ── Confirm modal ──────────────────────── */
    #confirm-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(7,7,19,0.7);
      backdrop-filter: blur(6px);
      z-index: 9998;
      align-items: center;
      justify-content: center;
    }
    #confirm-modal.visible { display: flex; }
    .confirm-box {
      background: var(--surface);
      border: 1px solid var(--border-hi);
      border-radius: 16px;
      padding: 24px;
      max-width: 360px;
      width: 90%;
      text-align: center;
    }
    .confirm-box h3 { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
    .confirm-box p { font-size: 12px; color: var(--text-dim); margin-bottom: 18px; }
    .confirm-actions { display: flex; gap: 8px; justify-content: center; }
    .confirm-btn {
      font-family: var(--font);
      font-size: 12px;
      font-weight: 600;
      padding: 7px 18px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.2s;
    }
    .confirm-btn.deny { background: var(--red-dim); color: var(--red); border-color: var(--red); }
    .confirm-btn.approve { background: var(--green-dim); color: var(--green); border-color: var(--green); }

    @media (max-width: 1080px) {
      body {
        grid-template-columns: 1fr;
        grid-template-rows: var(--header-h) minmax(0, 1fr) minmax(200px, 30vh);
        grid-template-areas:
          "header"
          "chat"
          "sidebar";
      }
      #sidebar {
        border-left: none;
        border-top: 1px solid var(--border);
      }
      #chat-composer {
        grid-template-columns: 1fr;
      }
      .composer-toggle { padding: 0; }
      #chat-send { min-height: 44px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">Jarvis <span>⌘</span></div>
  <div id="header-orb" class="idle"></div>
  <div id="status-label">Idle</div>
  <div id="waveform"></div>
  <div class="spacer"></div>
  <button class="btn" id="btn-wake">Wake</button>
  <button class="btn" id="btn-clear">Clear</button>
  <button class="btn" id="btn-mic">Mic</button>
  <span class="cmd-hint">⌘K</span>
  <div class="conn-badge" id="conn-badge">Connecting…</div>
</header>

<div id="filter-bar">
  <input id="action-filter" type="text" placeholder="Filter actions…" />
  <button class="btn" id="filter-close" style="padding:4px 10px;">✕</button>
</div>

<section id="chat-pane">
  <main id="chat">
    <div class="empty-state" id="empty-state">
      <div class="ring"></div>
      <p>Say <em>"Hey Jarvis"</em> or type to start</p>
    </div>
  </main>
  <form id="chat-composer">
    <textarea id="chat-input" placeholder="Message Jarvis…" rows="1"></textarea>
    <label class="composer-toggle" for="chat-speak">
      <input id="chat-speak" type="checkbox" />
      Speak
    </label>
    <button id="chat-send" type="submit">Send</button>
  </form>
</section>

<aside id="sidebar">
  <div class="panel" id="panel-health">
    <div class="panel-header" onclick="togglePanel('panel-health')">
      <span class="panel-title"><span class="icon">◈</span>System Health</span>
      <span class="panel-badge" id="health-count"></span>
      <span class="panel-collapse-icon">▾</span>
    </div>
    <div class="panel-body" id="subsystem-health"></div>
  </div>
  <div class="panel" id="panel-actions">
    <div class="panel-header" onclick="togglePanel('panel-actions')">
      <span class="panel-title"><span class="icon">▶</span>Recent Actions</span>
      <span class="panel-badge" id="actions-count"></span>
      <span class="panel-collapse-icon">▾</span>
    </div>
    <div class="panel-body" id="recent-actions"></div>
  </div>
  <div class="panel" id="panel-tasks">
    <div class="panel-header" onclick="togglePanel('panel-tasks')">
      <span class="panel-title"><span class="icon">◎</span>Active Tasks</span>
      <span class="panel-badge" id="tasks-count"></span>
      <span class="panel-collapse-icon">▾</span>
    </div>
    <div class="panel-body" id="active-tasks"></div>
  </div>
  <div class="panel" id="panel-metrics">
    <div class="panel-header" onclick="togglePanel('panel-metrics')">
      <span class="panel-title"><span class="icon">◆</span>Metrics</span>
      <span class="panel-collapse-icon">▾</span>
    </div>
    <div class="panel-body" id="operator-metrics"></div>
  </div>
  <div class="panel" id="panel-failures">
    <div class="panel-header" onclick="togglePanel('panel-failures')">
      <span class="panel-title"><span class="icon">⚠</span>Failures</span>
      <span class="panel-badge" id="failures-count"></span>
      <span class="panel-collapse-icon">▾</span>
    </div>
    <div class="panel-body" id="tool-failures"></div>
  </div>
  <div class="panel" id="panel-audit">
    <div class="panel-header" onclick="togglePanel('panel-audit')">
      <span class="panel-title"><span class="icon">◉</span>Authority</span>
      <span class="panel-collapse-icon">▾</span>
    </div>
    <div class="panel-body" id="authority-audit"></div>
  </div>
  <div class="panel" id="panel-reminders" style="flex:1; min-height:0;">
    <div class="panel-header" onclick="togglePanel('panel-reminders')">

      <span class="panel-collapse-icon">▾</span>
    </div>
    <div class="panel-body" style="flex:1; min-height:0;">
      <div id="reminders-list"></div>
    </div>
  </div>
</aside>

<div id="toast-container"></div>

<div id="confirm-modal">
  <div class="confirm-box">
    <h3 id="confirm-title">Confirm Action</h3>
    <p id="confirm-desc"></p>
    <div class="confirm-actions">
      <button class="confirm-btn deny" id="confirm-deny">Cancel</button>
      <button class="confirm-btn approve" id="confirm-approve">Confirm</button>
    </div>

</div>

<div id="cmd-palette">
  <div class="cmd-box">
    <div class="cmd-input-wrap">
      <input id="cmd-input" type="text" placeholder="Type a command…" autofocus />
    </div>
    <div class="cmd-results" id="cmd-results"></div>

<script>
const chat = document.getElementById('chat');
const emptyEl = document.getElementById('empty-state');
const headerOrb = document.getElementById('header-orb');
const statusLabel = document.getElementById('status-label');
const badge = document.getElementById('conn-badge');
const remindersList = document.getElementById('reminders-list');
const subsystemHealth = document.getElementById('subsystem-health');
const recentActions = document.getElementById('recent-actions');
const activeTasks = document.getElementById('active-tasks');
const operatorMetrics = document.getElementById('operator-metrics');
const toolFailures = document.getElementById('tool-failures');
const authorityAudit = document.getElementById('authority-audit');
const filterBar = document.getElementById('filter-bar');
const actionFilter = document.getElementById('action-filter');
const filterClose = document.getElementById('filter-close');
const confirmModal = document.getElementById('confirm-modal');
const confirmTitle = document.getElementById('confirm-title');
const confirmDesc = document.getElementById('confirm-desc');
const confirmDeny = document.getElementById('confirm-deny');
const confirmApprove = document.getElementById('confirm-approve');
const toastContainer = document.getElementById('toast-container');
const chatComposer = document.getElementById('chat-composer');
const chatInput = document.getElementById('chat-input');
const chatSpeak = document.getElementById('chat-speak');
const chatSend = document.getElementById('chat-send');
const waveformEl = document.getElementById('waveform');
const cmdPalette = document.getElementById('cmd-palette');
const cmdInput = document.getElementById('cmd-input');
const cmdResults = document.getElementById('cmd-results');

let atBottom = true;
let actionFilterText = '';
let latencyHistory = [];
let sessionStart = Date.now();
let pendingConfirmation = null;
const MAX_TOASTS = 3;
let cmdItems = [];
let cmdIdx = 0;

function formatTime(iso) {
  if (!iso) return 'recurring';
  const d = new Date(iso);
  return d.toLocaleString(undefined, { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
}
function timeAgo(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  const sec = Math.floor((Date.now() - d.getTime()) / 1000);
  if (sec < 5)  return 'now';
  if (sec < 60) return `${sec}s`;
  const min = Math.floor(sec / 60);
  if (min < 60) return `${min}m`;
  return `${Math.floor(min/60)}h ago`;
}
function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function setStatus(state) {
  headerOrb.className = state || 'idle';
  const labels = { idle:'Idle', listening:'Listening', processing:'Processing', speaking:'Speaking', wake:'Wake', success:'Success', error:'Error', hidden:'Standby' };
  statusLabel.textContent = labels[state] || state || 'Idle';
}

/* ── Waveform ────────────────────────────── */
function initWaveform(count) {
  waveformEl.innerHTML = '';
  for (let i = 0; i < count; i++) {
    const bar = document.createElement('div');
    bar.className = 'bar idle';
    waveformEl.appendChild(bar);
  }
}
function animateWaveform(state, level) {
  const bars = waveformEl.querySelectorAll('.bar');
  const n = bars.length;
  const now = Date.now();
  bars.forEach((bar, i) => {
    if (!state || state === 'idle' || state === 'hidden') {
      bar.className = 'bar idle';
      return;
    }
    const activeMin = 3;
    const activeMax = n - 3;
    const variance = Math.sin(now / 300 + i * 0.8) * 0.4 + 0.6;
    let h;
    if (i < activeMin) h = 2 + Math.sin(now / 200 + i) * 1.5 + 2;
    else if (i > activeMax) h = 2 + Math.cos(now / 200 + i) * 1.5 + 2;
    else h = 4 + (level || 0.5) * 14 * variance;
    bar.style.height = Math.max(2, Math.min(22, h)) + 'px';
    if (state === 'speaking') bar.className = 'bar speaking';
    else if (state === 'listening') bar.className = 'bar active';
    else bar.className = 'bar active';
  });
}
initWaveform(24);
setInterval(() => animateWaveform(headerOrb.className.replace('header-orb ',''), 0.4), 80);

/* ── Markdown ────────────────────────────── */
function renderMarkdown(text) {
  if (!text) return '';
  let out = escapeHtml(text);
  out = out.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  out = out.replace(/_(.+?)_/g, '<em>$1</em>');
  out = out.replace(/`([^`]+)`/g, '<code>$1</code>');
  out = out.replace(/```([\s\S]*?)```/g, (_, code) => `<pre><code class="hljs">${hljsHighlight(code.trim())}</code></pre>`);
  out = out.replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2" target="_blank">$1</a>');
  return out;
}
function hljsHighlight(code) {
  try { return hljs.highlightAuto(code).value; }
  catch(e) { return escapeHtml(code); }
}

/* ── Toast ───────────────────────────────── */
function showToast(message, type = 'info', duration = 4000) {
  const icons = { success: '✓', error: '✕', info: 'ℹ' };
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = `<span class="toast-icon">${icons[type] || icons.info}</span><span>${escapeHtml(message)}</span>`;
  toastContainer.appendChild(toast);
  while (toastContainer.children.length > MAX_TOASTS) toastContainer.firstChild.remove();
  setTimeout(() => { toast.classList.add('leaving'); setTimeout(() => toast.remove(), 250); }, duration);
}

/* ── Confirm modal ───────────────────────── */
function showConfirm(toolName, action, dryRun) {
  pendingConfirmation = { toolName, action, dryRun };
  confirmTitle.textContent = `Confirm: ${toolName}`;
  confirmDesc.textContent = dryRun ? `Preview: ${dryRun}` : `Proceed with "${action}"?`;
  confirmModal.classList.add('visible');
}
function hideConfirm() { pendingConfirmation = null; confirmModal.classList.remove('visible'); }
confirmDeny.addEventListener('click', () => { if (pendingConfirmation) apiConfirm(pendingConfirmation.toolName, 'denied'); hideConfirm(); });
confirmApprove.addEventListener('click', () => { if (pendingConfirmation) apiConfirm(pendingConfirmation.toolName, 'approved'); hideConfirm(); });

/* ── Panels ──────────────────────────────── */
function togglePanel(id) { document.getElementById(id).classList.toggle('collapsed'); }
function updateBadge(id, count) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = count > 0 ? count : '';
}

/* ── Chat ────────────────────────────────── */
function addMessage(role, text, ts) {
  emptyEl.style.display = 'none';
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  const roleLabel = role === 'user' ? 'You' : 'Jarvis';
  const timestamp = ts ? ` <span class="timestamp">${timeAgo(ts)}</span>` : '';
  const rendered = role === 'assistant' ? renderMarkdown(text) : escapeHtml(text);
  div.innerHTML = `<div class="role">${roleLabel}${timestamp}</div>${rendered}<button class="copy-btn" title="Copy">⎘</button>`;
  div.querySelector('.copy-btn').addEventListener('click', () => {
    navigator.clipboard.writeText(text).catch(() => {});
    div.querySelector('.copy-btn').textContent = '✓';
    setTimeout(() => { div.querySelector('.copy-btn').textContent = '⎘'; }, 1500);
  });
  chat.appendChild(div);
  if (atBottom) chat.scrollTop = chat.scrollHeight;
}

chat.addEventListener('scroll', () => {
  const threshold = 40;
  atBottom = (chat.scrollHeight - chat.scrollTop - chat.clientHeight) < threshold;
});
function highlightNewMessages() {
  chat.querySelectorAll('.msg.assistant pre code:not(.hljs)').forEach(b => hljs.highlightElement(b));
}

/* ── Reminders ───────────────────────────── */
function renderReminders(reminders) {
  remindersList.innerHTML = '';
  updateBadge('reminders-count', reminders.length);
  if (!reminders.length) { remindersList.innerHTML = '<div class="no-reminders">No pending reminders</div>'; return; }
  reminders.forEach(r => {
    const card = document.createElement('div');
    card.className = 'reminder-card';
    card.innerHTML = `
      <div class="r-icon">◷</div>
      <div class="r-body">
        <div class="r-msg">${escapeHtml(r.message)}</div>
        <div class="r-time">${r.cron_expr ? 'Recurring' : formatTime(r.trigger_time)}</div>
      </div>
      <button class="r-cancel">✕</button>`;
    card.querySelector('.r-cancel').addEventListener('click', () => cancelReminder(r.id, card));
    remindersList.appendChild(card);
  });
}

/* ── Panels ──────────────────────────────── */
function renderSubsystemHealth(health) {
  subsystemHealth.innerHTML = '';
  const entries = Object.entries(health || {});
  updateBadge('health-count', entries.length);
  entries.forEach(([name, state]) => {
    const row = document.createElement('div');
    row.className = 'subsystem-row';
    row.innerHTML = `<div class="label">${escapeHtml(name)}</div><div class="pill ${state}">${state}</div>`;
    subsystemHealth.appendChild(row);
  });
}
function renderRecentActions(actions) {
  const filtered = actionFilterText
    ? actions.filter(a => (a.tool_name || '').toLowerCase().includes(actionFilterText.toLowerCase()))
    : actions;
  recentActions.innerHTML = '';
  updateBadge('actions-count', filtered.length);
  filtered.slice(0, 8).forEach(a => {
    const row = document.createElement('div');
    row.className = 'action-row';
    row.innerHTML = `<div class="label">${escapeHtml(a.tool_name || '?')} · ${a.duration_ms || 0}ms</div><div class="pill ${a.kind || a.status || '?'}">${a.kind || a.status || '?'}</div>`;
    recentActions.appendChild(row);
  });
}
function renderActiveTasks(tasks) {
  const entries = Object.values(tasks || {}).filter(t => !['completed','failed'].includes(t.action || t.state || ''));
  activeTasks.innerHTML = '';
  updateBadge('tasks-count', entries.length);
  entries.forEach(t => {
    const state = t.action || t.state || 'pending';
    const row = document.createElement('div');
    row.className = 'task-row';
    row.innerHTML = `<div class="label">${escapeHtml(t.goal || '?')}</div><div class="pill ${state}">${state}</div>`;
    activeTasks.appendChild(row);
  });
}
function renderOperatorMetrics(metrics) {
  operatorMetrics.innerHTML = '';
  if (!metrics || !Object.keys(metrics).length) return;
  const total = metrics.total_calls ?? 0;
  const failRate = Math.round((metrics.failure_rate ?? 0) * 100);
  const liveLat = metrics.live_recent_avg_latency_ms ?? metrics.avg_latency_ms ?? 0;
  const failures = metrics.recent_failures ?? 0;

  if (liveLat > 0) {
    latencyHistory.push(liveLat);
    if (latencyHistory.length > 20) latencyHistory.shift();
  }

  const grid = document.createElement('div');
  grid.className = 'metrics-grid';
  [
    { label: 'Total Calls', value: total },
    { label: 'Failures', value: failures },
    { label: 'Failure Rate', value: `${failRate}%` },
    { label: 'Avg Latency', value: `${liveLat}ms` },
  ].forEach(c => {
    const node = document.createElement('div');
    node.className = 'metric-card';
    node.innerHTML = `<div class="metric-value">${c.value}</div><div class="metric-label">${c.label}</div>`;
    grid.appendChild(node);
  });

  if (latencyHistory.length > 1) {
    const canvas = document.createElement('canvas');
    canvas.width = 300; canvas.height = 28;
    canvas.style.width = '100%'; canvas.style.height = '28px';
    grid.appendChild(canvas);
    drawSparkline(canvas, latencyHistory);
  }

  const uptime = Math.floor((Date.now() - sessionStart) / 1000);
  const uptimeStr = uptime < 60 ? `${uptime}s` : uptime < 3600 ? `${Math.floor(uptime/60)}m ${uptime%60}s` : `${Math.floor(uptime/3600)}h ${Math.floor((uptime%3600)/60)}m`;
  const uptimeDiv = document.createElement('div');
  uptimeDiv.id = 'uptime-display';
  uptimeDiv.textContent = `Uptime: ${uptimeStr}`;
  grid.appendChild(uptimeDiv);
  operatorMetrics.appendChild(grid);
}
function drawSparkline(canvas, data) {
  if (!canvas || !data.length) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.width;
  const h = canvas.height;
  const min = Math.min(...data);
  const max = Math.max(...data);
  const range = max - min || 1;
  const step = w / (data.length - 1);
  ctx.clearRect(0, 0, w, h);
  ctx.strokeStyle = '#D4A84B';
  ctx.lineWidth = 1.5;
  ctx.shadowBlur = 4;
  ctx.shadowColor = 'rgba(212,168,75,0.3)';
  ctx.beginPath();
  data.forEach((v, i) => {
    const x = i * step;
    const y = h - ((v - min) / range) * (h - 4) - 2;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.stroke();
}
function renderFailures(failures) {
  toolFailures.innerHTML = '';
  updateBadge('failures-count', failures.length);
  failures.slice(0, 5).forEach(f => {
    const row = document.createElement('div');
    row.className = 'failure-row';
    row.innerHTML = `<div class="label">${escapeHtml(f.tool_name || '?')} · ${escapeHtml((f.error || '').slice(0, 50))}</div><div class="pill failed">failed</div>`;
    toolFailures.appendChild(row);
  });
}
function renderAuthorityAudit(entries, summary) {
  authorityAudit.innerHTML = '';
  if (summary) {
    const chips = [];
    if (summary.approved) chips.push(`<span class="auth-chip approved">✓ ${summary.approved}</span>`);
    if (summary.denied)  chips.push(`<span class="auth-chip denied">✕ ${summary.denied}</span>`);
    if (summary.blocked) chips.push(`<span class="auth-chip blocked">⛔ ${summary.blocked}</span>`);
    if (chips.length) {
      const div = document.createElement('div');
      div.className = 'auth-summary';
      div.innerHTML = chips.join('');
      authorityAudit.appendChild(div);
    }
  }
  if (!entries || !entries.length) return;
  entries.slice(0, 5).forEach(e => {
    const outcome = (e.action_outcome || 'unknown').toLowerCase();
    const row = document.createElement('div');
    row.className = 'audit-row';
    row.innerHTML = `<div class="label">${escapeHtml(e.tool_name || '?')} · risk ${e.risk_level ?? '?'}</div><div class="pill ${outcome}">${outcome}</div>`;
    authorityAudit.appendChild(row);
  });
}

/* ── API ─────────────────────────────────── */
async function apiAction(method, path, body) {
  try {
    const opts = { method, headers: { 'Content-Type': 'application/json' } };
    if (body) opts.body = JSON.stringify(body);
    const r = await fetch(path, opts);
    return r.ok ? await r.json().catch(() => ({})) : null;
  } catch(e) { return null; }
}
async function loadReminders() {
  const d = await apiAction('GET', '/api/reminders');
  if (d) renderReminders(d);
}
async function loadOperatorStatus() {
  const d = await apiAction('GET', '/api/operator');
  if (!d) return;
  renderSubsystemHealth(d.subsystem_health || {});
  renderRecentActions(d.recent_actions || []);
  renderActiveTasks(d.active_tasks || {});
  renderOperatorMetrics(d.operator_metrics || d.api_stats || {});
  renderFailures(d.tool_failures || []);
  renderAuthorityAudit(d.authority_audit || [], d.authority_summary || null);
  if (d.state) setStatus(d.state);
  highlightNewMessages();
}
async function cancelReminder(id, card) {
  card.style.opacity = '0.4';
  card.style.pointerEvents = 'none';
  const ok = await apiAction('POST', `/api/reminder/${id}/cancel`);
  if (ok) { card.remove(); updateBadge('reminders-count', remindersList.children.length); }
  else { card.style.opacity = ''; card.style.pointerEvents = ''; }
}
async function apiConfirm(toolName, outcome) {
  await apiAction('POST', '/api/confirm', { tool_name: toolName, outcome });
}
async function apiChat(message, speak = false) {
  return await apiAction('POST', '/api/chat', { message, speak });
}

/* ── Quick Actions ───────────────────────── */
document.getElementById('btn-wake').addEventListener('click', async e => {
  e.target.classList.add('loading');
  await apiAction('POST', '/api/wake');
  setTimeout(() => e.target.classList.remove('loading'), 800);
});
document.getElementById('btn-clear').addEventListener('click', async e => {
  e.target.classList.add('loading');
  await apiAction('POST', '/api/clear_memory');
  showToast('Memory cleared', 'success');
  setTimeout(() => e.target.classList.remove('loading'), 800);
});
document.getElementById('btn-mic').addEventListener('click', async e => {
  e.target.classList.add('loading');
  await apiAction('POST', '/api/toggle_mic');
  setTimeout(() => e.target.classList.remove('loading'), 800);
});

/* ── Chat composer ───────────────────────── */
chatInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); chatComposer.requestSubmit(); }
});
chatComposer.addEventListener('submit', async e => {
  e.preventDefault();
  const message = chatInput.value.trim();
  if (!message) return;
  chatSend.disabled = true; chatInput.disabled = true;
  const result = await apiChat(message, chatSpeak.checked);
  if (result && result.ok) { chatInput.value = ''; chatInput.style.height = ''; }
  else showToast(result?.error || 'Message failed', 'error');
  chatSend.disabled = false; chatInput.disabled = false; chatInput.focus();
});

/* ── SSE ─────────────────────────────────── */
function connect() {
  const es = new EventSource('/stream');
  es.onopen = () => { badge.textContent = 'Live'; badge.className = 'conn-badge live'; };
  es.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'state') setStatus(msg.data.state);
    else if (msg.type === 'message') { addMessage(msg.data.role, msg.data.text, msg.data.timestamp); loadReminders(); loadOperatorStatus(); }
    else if (msg.type === 'tool') { loadOperatorStatus(); if (msg.data.action === 'failed') showToast(`Tool failed: ${msg.data.tool_name}`, 'error'); }
    else if (msg.type === 'confirmation') {
      if (msg.data.action === 'requested') showConfirm(msg.data.tool_name, msg.data.action, msg.data.dry_run);
      else { showToast(`${msg.data.tool_name}: ${msg.data.action}`, msg.data.action === 'approved' ? 'success' : 'info'); loadOperatorStatus(); }
    } else if (msg.type === 'subsystem' || msg.type === 'task' || msg.type === 'status') {
      loadOperatorStatus();
      if (msg.type === 'status') showToast(msg.data.text, 'info', 3000);
    }
  };
  es.onerror = () => { badge.textContent = 'Reconnecting…'; badge.className = 'conn-badge'; es.close(); setTimeout(connect, 3000); };
}

/* ── Command Palette ─────────────────────── */
const COMMANDS = [
  { key: 'w', label: 'Wake Assistant', desc: 'Trigger wake and start listening', action: () => apiAction('POST', '/api/wake') },
  { key: 'c', label: 'Clear Memory', desc: 'Reset conversation and long-term memory', action: () => { apiAction('POST', '/api/clear_memory'); showToast('Memory cleared', 'success'); } },
  { key: 'm', label: 'Toggle Microphone', desc: 'Enable or disable mic', action: () => apiAction('POST', '/api/toggle_mic') },
  { key: 'r', label: 'Refresh Dashboard', desc: 'Reload operator status', action: () => loadOperatorStatus() },
  { key: 'f', label: 'Filter Actions', desc: 'Search recent tool actions', action: () => { filterBar.classList.add('visible'); actionFilter.focus(); } },
  { key: 'k', label: 'Command Palette', desc: 'Toggle this palette', action: () => toggleCmd() },
  { key: 'Esc', label: 'Close Panels', desc: 'Re-collapse all sidebar panels', action: () => document.querySelectorAll('.panel').forEach(p => p.classList.remove('collapsed')) },
];

function toggleCmd() {
  cmdPalette.classList.toggle('visible');
  if (cmdPalette.classList.contains('visible')) { cmdInput.value = ''; cmdInput.focus(); filterCommands(); }
}
function filterCommands() {
  const q = cmdInput.value.toLowerCase();
  cmdItems = COMMANDS.filter(c => c.label.toLowerCase().includes(q) || c.key.toLowerCase().includes(q));
  cmdIdx = 0;
  renderCmdResults();
}
function renderCmdResults() {
  cmdResults.innerHTML = '';
  cmdItems.forEach((item, i) => {
    const div = document.createElement('div');
    div.className = `cmd-item${i === cmdIdx ? ' selected' : ''}`;
    div.innerHTML = `<span class="cmd-key">${item.key}</span><span class="cmd-label">${item.label}</span><span class="cmd-desc">${item.desc}</span>`;
    div.addEventListener('click', () => { cmdPalette.classList.remove('visible'); item.action(); });
    div.addEventListener('mouseenter', () => { cmdIdx = i; renderCmdResults(); });
    cmdResults.appendChild(div);
  });
}
cmdInput.addEventListener('input', filterCommands);
cmdInput.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { e.preventDefault(); cmdIdx = Math.min(cmdIdx + 1, cmdItems.length - 1); renderCmdResults(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); cmdIdx = Math.max(cmdIdx - 1, 0); renderCmdResults(); }
  else if (e.key === 'Enter' && cmdItems[cmdIdx]) { cmdPalette.classList.remove('visible'); cmdItems[cmdIdx].action(); }
  else if (e.key === 'Escape') cmdPalette.classList.remove('visible');
});

/* ── Keyboard Shortcuts ──────────────────── */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    hideConfirm();
    if (filterBar.classList.contains('visible')) { filterBar.classList.remove('visible'); actionFilterText = ''; loadOperatorStatus(); }
    cmdPalette.classList.remove('visible');
  }
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); toggleCmd(); }
  if (e.key === 'r' && !e.metaKey && !e.ctrlKey && document.activeElement.tagName !== 'INPUT' && !cmdPalette.classList.contains('visible')) { loadOperatorStatus(); showToast('Dashboard refreshed', 'info', 2000); }
});

/* Filter */
actionFilter.addEventListener('input', () => { actionFilterText = actionFilter.value; loadOperatorStatus(); });
filterClose.addEventListener('click', () => { filterBar.classList.remove('visible'); actionFilterText = ''; loadOperatorStatus(); });

/* ── Init ────────────────────────────────── */
loadReminders();
loadOperatorStatus();
connect();
setInterval(loadReminders, 30_000);
setInterval(loadOperatorStatus, 5_000);
</script>
