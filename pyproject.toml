[project]
name = "hey-jarvis"
version = "0.5.0"
description = "Personal AI Voice Assistant"
requires-python = ">=3.11"
dependencies = [
    "openwakeword>=0.6.0",
    "faster-whisper>=1.0.0",
    "edge-tts>=6.1.0",
    "pyttsx3>=2.90",
    "ollama>=0.3.0",
    "google-generativeai>=0.8.0",
    "google-genai>=1.0.0",
    "groq>=0.4.0",
    "openai>=1.0.0",
    "pyaudio>=0.2.14",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "silero-vad>=5.1",
    "pystray>=0.19.0",
    "Pillow>=10.0.0",
    "pyperclip>=1.8.0",
    "google-auth>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "google-api-python-client>=2.0.0",
    "pywinauto>=0.6.8",
    "pyautogui>=0.9.54",
    "psutil>=5.9.0",
    "keyboard>=0.13.5",
    "rapidfuzz>=3.0.0",
    "aiohttp>=3.9.0",
    "flask>=3.0.0",
    "playwright>=1.40.0",
    "python-dotenv>=1.0.0",
    "aiofiles>=23.0.0",
    "croniter>=2.0.0",
    "mcp>=1.0.0",
    "sqlite-vec>=0.1.0",
    "PyQt6>=6.6.0",
    "PyYAML>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.setuptools.packages.find]
# Flat-layout repo has many top-level dirs (gui, data, skills, AionUi,
# assets, workflows) that are NOT installable packages. Restrict discovery
# to the real packages so `pip install -e .` works (CI test job needs it).
include = ["assistant*", "dashboard*"]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = ["AionUi", "mcp-tools", "venv", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501", "B008", "B023", "N802", "E402", "B904"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.pyright]
include = ["skills", "assistant"]
exclude = ["**/node_modules"]
reportMissingImports = true
reportMissingTypeStubs = false
pythonVersion = "3.11"