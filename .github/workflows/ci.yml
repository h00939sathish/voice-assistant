name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check assistant/ skills/ --statistics

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system libs
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: Install dependencies
        run: |
          pip install pytest pytest-asyncio
          pip install -e . --no-deps
          pip install flask requests python-dotenv numpy sounddevice
          pip install fastapi httpx python-multipart pyyaml aiohttp
          pip install ollama openai groq google-generativeai google-genai
          pip install edge-tts pyttsx3 psutil "mcp<2"

      - name: Install dashboard deps
        run: pip install flask requests python-dotenv

      - name: Run tests
        run: >
          pytest tests/ -v
          --ignore=tests/test_wake_word.py --ignore=tests/test_voice_assistant.py
          --ignore=tests/test_tool_use.py
          --deselect=tests/test_foundational_build.py::test_llm_router_stops_after_confirmation_denial
          -x
        env:
          GEMINI_API_KEY: dummy
          OPENAI_API_KEY: dummy

      - name: Test dashboard starts
        run: |
          python -c "from dashboard.app import app; rules=list(app.url_map.iter_rules()); print('Dashboard imports OK: routes:', len(rules))"