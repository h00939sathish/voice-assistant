name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check assistant/ skills/ --statistics

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pytest pytest-asyncio
          pip install -e .

      - name: Install dashboard deps
        run: pip install flask requests

      - name: Run tests
        run: >
          pytest tests/ -v
          --ignore=tests/test_wake_word.py --ignore=tests/test_voice_assistant.py
          --ignore=tests/test_tool_use.py
          --deselect=tests/test_foundational_build.py::test_llm_router_stops_after_confirmation_denial
          -x
        env:
          GEMINI_API_KEY: dummy
          OPENAI_API_KEY: dummy

      - name: Test dashboard starts
        run: |
          cd dashboard
          python -c "from app import app; print('Dashboard imports OK: routes:', len([r for r in app.routes if r.endpoint and not r.endpoint.startswith('static')]))"